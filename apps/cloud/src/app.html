<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- El mismo emoji que ya usa `ICONS.brand` (@esr/ui/icons.ts) en la
		     barra lateral de las dos apps: sin un logo propio en el repo, es la
		     marca que ya existe, no una nueva. -->
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>" />
		<title>ESR Cloud</title>
		<script>
			// Pinta el tema antes del primer paint. Sin esto la app sale en
			// claro y salta a oscuro al hidratar. Debe ser sincrono: nada de
			// defer ni type="module". El atributo ya viene puesto en la
			// plantilla, asi que si este script falla queda el claro y no un
			// documento sin tema.
			(function () {
				try {
					var t = localStorage.getItem('esr_theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {
					/* modo privado o almacenamiento bloqueado: se queda en claro */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
