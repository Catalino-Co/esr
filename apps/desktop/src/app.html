<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- El mismo emoji que ya usa `ICONS.brand` (@esr/ui/icons.ts) en la
		     barra lateral de las dos apps: sin un logo propio en el repo, es la
		     marca que ya existe, no una nueva. -->
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>" />
		<title>ESR Pro</title>
		<script>
			// Aplica tema y densidad antes del primer paint. Sin esto la app
			// arranca con el tema y el tamano por defecto y salta al hidratar.
			// Debe ser sincrono: nada de defer ni type="module".
			// Los umbrales de escala estan duplicados en getAppearanceScale()
			// de src/routes/+layout.svelte; si cambian, cambiar en ambos sitios.
			(function () {
				var d = document.documentElement;
				var pref = 'auto';
				var theme = 'light';
				try {
					var t = localStorage.getItem('esr_theme');
					if (t === 'light' || t === 'dark') theme = t;
					pref = localStorage.getItem('esr_appearance_size') || 'auto';
				} catch (e) {
					// Electron sirve desde file://, donde el acceso puede lanzar.
				}
				var dpr = window.devicePixelRatio || 1;
				var scale =
					pref === 'compact'
						? 0.9
						: pref === 'normal'
							? 1
							: pref === 'comfortable'
								? 1.06
								: dpr >= 1.5
									? 0.9
									: dpr >= 1.25
										? 0.96
										: 1;
				d.setAttribute('data-theme', theme);
				d.style.setProperty('--ui-font-scale', String(scale));
				d.dataset.uiSize = scale < 0.95 ? 'compact' : scale > 1 ? 'comfortable' : 'normal';
				d.dataset.uiPreference = pref;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
